<svg width="100%" viewBox="0 0 680 320" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Building logo fix, before and after</title>
<desc>The detail header currently renders the building logo twice so they overlap; the fix keeps a single positioned logo. The list card shows the logo plus a redundant Logo badge; the fix removes the badge.</desc>
<style>
.box{fill:#ffffff;stroke:#d3d1c7;stroke-width:.5}
.th{font:500 14px sans-serif;fill:#2c2c2a}
.ts{font:400 12px sans-serif;fill:#5f5e5a}
.c-red rect{fill:#fceaea;stroke:#a32d2d;stroke-width:.5}
.c-red .ts{fill:#791f1f}
.c-teal rect{fill:#e1f5ee;stroke:#0f6e56;stroke-width:.5}
.c-blue{fill:#e6f1fb;stroke:#185fa5;stroke-width:.5}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="40" y="24">Building detail header</text>
<rect class="box" x="40" y="34" width="250" height="86" rx="8"/>
<g class="c-red"><rect x="58" y="48" width="30" height="30" rx="4"/><rect x="74" y="60" width="30" height="30" rx="4"/></g>
<text class="ts" x="58" y="108">two logos overlap</text>
<line class="arr" x1="300" y1="77" x2="348" y2="77" marker-end="url(#arrow)"/>
<rect class="box" x="360" y="34" width="250" height="86" rx="8"/>
<g class="c-teal"><rect x="378" y="48" width="30" height="30" rx="4"/></g>
<text class="ts" x="378" y="108">one positioned logo kept</text>

<text class="th" x="40" y="158">Building list card</text>
<rect class="box" x="40" y="168" width="250" height="96" rx="8"/>
<rect class="c-blue" x="56" y="182" width="28" height="28" rx="4"/>
<g class="c-red"><rect x="220" y="182" width="54" height="20" rx="10"/><text class="ts" x="247" y="196" text-anchor="middle">Logo</text></g>
<text class="ts" x="56" y="246">logo + redundant badge</text>
<line class="arr" x1="300" y1="216" x2="348" y2="216" marker-end="url(#arrow)"/>
<rect class="box" x="360" y="168" width="250" height="96" rx="8"/>
<g class="c-teal"><rect x="376" y="182" width="28" height="28" rx="4"/></g>
<text class="ts" x="376" y="246">badge removed</text>

<g class="c-red"><rect x="40" y="288" width="12" height="12" rx="3"/></g>
<text class="ts" x="58" y="298">remove / bug</text>
<g class="c-teal"><rect x="168" y="288" width="12" height="12" rx="3"/></g>
<text class="ts" x="186" y="298">keep</text>
</svg>
