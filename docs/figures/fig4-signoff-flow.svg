<svg width="100%" viewBox="0 0 680 224" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Forms multi-signer sign-off flow</title>
<desc>A submitted form is assigned to one or more signers, who are notified and sign by drawing or typing. When all required signers have signed, the submission is complete. Exceptions: an overdue request triggers reminders then expires; a decline rejects the submission.</desc>
<style>
.th{font:500 14px sans-serif}
.ts{font:400 12px sans-serif}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-gray rect{fill:#f1efe8;stroke:#5f5e5a;stroke-width:.5}.c-gray .th{fill:#2c2c2a}.c-gray .ts{fill:#444441}
.c-teal rect{fill:#e1f5ee;stroke:#0f6e56;stroke-width:.5}.c-teal .th{fill:#04342c}.c-teal .ts{fill:#0f6e56}
.c-green rect{fill:#eaf3de;stroke:#3b6d11;stroke-width:.5}.c-green .th{fill:#173404}.c-green .ts{fill:#3b6d11}
.c-amber rect{fill:#faeeda;stroke:#854f0b;stroke-width:.5}.c-amber .th{fill:#412402}.c-amber .ts{fill:#854f0b}
.c-red rect{fill:#fceaea;stroke:#a32d2d;stroke-width:.5}.c-red .th{fill:#501313}.c-red .ts{fill:#791f1f}
.lbl{font:400 12px sans-serif;fill:#5f5e5a}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-gray"><rect x="44" y="44" width="104" height="52" rx="6"/><text class="th" x="96" y="74" text-anchor="middle">Submitted</text></g>
<g class="c-teal"><rect x="163" y="44" width="104" height="52" rx="6"/><text class="th" x="215" y="68" text-anchor="middle">Assign</text><text class="ts" x="215" y="84" text-anchor="middle">set signers</text></g>
<g class="c-teal"><rect x="282" y="44" width="104" height="52" rx="6"/><text class="th" x="334" y="68" text-anchor="middle">Notify</text><text class="ts" x="334" y="84" text-anchor="middle">the signer</text></g>
<g class="c-teal"><rect x="401" y="44" width="104" height="52" rx="6"/><text class="th" x="453" y="68" text-anchor="middle">Sign</text><text class="ts" x="453" y="84" text-anchor="middle">drawn/typed</text></g>
<g class="c-green"><rect x="520" y="44" width="104" height="52" rx="6"/><text class="th" x="572" y="68" text-anchor="middle">Complete</text><text class="ts" x="572" y="84" text-anchor="middle">all signed</text></g>

<line class="arr" x1="148" y1="70" x2="161" y2="70" marker-end="url(#arrow)"/>
<line class="arr" x1="267" y1="70" x2="280" y2="70" marker-end="url(#arrow)"/>
<line class="arr" x1="386" y1="70" x2="399" y2="70" marker-end="url(#arrow)"/>
<line class="arr" x1="505" y1="70" x2="518" y2="70" marker-end="url(#arrow)"/>

<text class="lbl" x="44" y="158">Exceptions</text>
<path class="arr" d="M334 96 L334 114 L238 114 L238 130" marker-end="url(#arrow)"/>
<path class="arr" d="M453 96 L453 114 L476 114 L476 130" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="163" y="130" width="150" height="50" rx="6"/><text class="th" x="238" y="153" text-anchor="middle">Overdue</text><text class="ts" x="238" y="169" text-anchor="middle">remind, then expire</text></g>
<g class="c-red"><rect x="401" y="130" width="150" height="50" rx="6"/><text class="th" x="476" y="153" text-anchor="middle">Declined</text><text class="ts" x="476" y="169" text-anchor="middle">rejected</text></g>

<g class="c-teal"><rect x="44" y="196" width="12" height="12" rx="3"/></g>
<text class="lbl" x="62" y="206">active steps</text>
<g class="c-green"><rect x="172" y="196" width="12" height="12" rx="3"/></g>
<text class="lbl" x="190" y="206">success</text>
<g class="c-amber"><rect x="282" y="196" width="12" height="12" rx="3"/></g>
<text class="lbl" x="300" y="206">warning</text>
<g class="c-red"><rect x="392" y="196" width="12" height="12" rx="3"/></g>
<text class="lbl" x="410" y="206">decline</text>
</svg>
