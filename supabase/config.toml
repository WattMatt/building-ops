# PRODUCTION. Was "xuqxnpipetruujcuuflq" (the near-empty Building Ops clone) from
# 2026-06-17 until 2026-08-04, so every `supabase functions deploy` in that window
# silently shipped to the clone. Production consequently never received
# request-password-reset, and password recovery was dead for ~7 weeks.
# Prefer an explicit target anyway:
#   supabase functions deploy <fn> --project-ref qdzgkttiosahdfqresvz
project_id = "qdzgkttiosahdfqresvz"

[functions.delete-account]
verify_jwt = false

[functions.invite-user]
verify_jwt = false

# Public self-service reset / fresh-setup-link endpoint (enumeration-safe).
[functions.request-password-reset]
verify_jwt = false

[functions.set-user-status]
verify_jwt = false

# Server-side role change (validates the JWT + admin role itself, like set-user-status).
[functions.set-user-role]
verify_jwt = false

# Self-service clear of the first-login gate (validates the JWT itself, like
# set-user-status; the profiles trigger blocks any client-side flag write).
[functions.clear-password-gate]
verify_jwt = false

[functions.notify-form-submission]
verify_jwt = false

[functions.notify-form-review]
verify_jwt = false

[functions.notify-expiring-alerts]
verify_jwt = false

# Client-invoked (authenticated): require a JWT so they can't be hit anonymously.
[functions.notify-signoff-request]
verify_jwt = true

[functions.notify-signoff-complete]
verify_jwt = true

# Client-invoked (authenticated): require a JWT so they can't be hit anonymously.
[functions.notify]
verify_jwt = true

# Cron-invoked (no user JWT): guarded by the x-digest-secret header instead.
[functions.daily-digest]
verify_jwt = false

# Cron-invoked (no user JWT): guarded by the x-signoff-secret header instead.
[functions.signoff-reminders]
verify_jwt = false

# Public calendar subscription feed (no user JWT — Outlook/Google fetch it server-side):
# scoped by a secret token looked up with the service role; unknown/revoked → 404.
[functions.ics-feed]
verify_jwt = false

# Cron-invoked (x-distribution-secret) OR admin/manager JWT validated in code (run-now).
[functions.report-distribution]
verify_jwt = false

# Public share-link endpoint (no user JWT): token looked up with the service role; unknown/expired/revoked → 404.
[functions.report-share]
verify_jwt = false
