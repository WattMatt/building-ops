name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Ratchet, not a pass/fail gate. The project carries a backlog of real type
      # errors (TS2345 / TS2339 / TS7053), so demanding zero would keep CI red
      # forever and teach everyone to ignore it. Instead the count may only go
      # DOWN: exceed the baseline and the build fails; come in under it and the
      # job tells you to commit the lower number.
      - name: Typecheck (must not exceed baseline)
        run: |
          set -o pipefail
          npx tsc --noEmit -p tsconfig.app.json 2>&1 | tee /tmp/tsc.log || true
          COUNT=$(grep -c 'error TS' /tmp/tsc.log || true)
          BASE=$(tr -d '[:space:]' < .github/typecheck-baseline.txt)
          echo "typecheck errors: $COUNT (baseline $BASE)"
          if [ "$COUNT" -gt "$BASE" ]; then
            echo "::error::Typecheck regressed: $COUNT errors vs baseline $BASE."
            echo "Errors:"
            grep 'error TS' /tmp/tsc.log | head -40
            exit 1
          fi
          if [ "$COUNT" -lt "$BASE" ]; then
            echo "::notice::Typecheck improved to $COUNT — lower .github/typecheck-baseline.txt to $COUNT to lock it in."
          fi

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
